# Compila la app Android (APK) y la deja en public/gps-flota.apk,
# para que se pueda descargar desde la web.
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Número de versión
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_NAME=1.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Crear el proyecto Android
        working-directory: android-app
        run: |
          npm ci
          # La app se identifica con su versión para que la web pueda avisar de actualizaciones
          node -e "const f='capacitor.config.json',c=require('./'+f);c.appendUserAgent='GPSFlotaApp/'+process.env.VERSION_CODE;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          npx capacitor-assets generate --android || echo "No se pudieron generar los iconos; se usan los de serie"

      - name: Permisos de ubicación
        working-directory: android-app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />#' $M
          grep -q ACCESS_FINE_LOCATION $M

      - name: Versión, firma y código propio
        working-directory: android-app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep -q "versionCode $VERSION_CODE" android/app/build.gradle
          # Siempre la misma firma, para que cada APK nueva se instale encima de la anterior
          mkdir -p ~/.android && cp firma/debug.keystore ~/.android/debug.keystore
          cp nativo/MainActivity.java android/app/src/main/java/es/gpsflota/app/MainActivity.java
          npx cap sync android

      - name: Compilar
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar la APK
        uses: actions/upload-artifact@v4
        with:
          name: gps-flota-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicarla en la web
        run: |
          # deshacer el cambio temporal de la configuración antes de guardar
          git checkout -- android-app/capacitor.config.json
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk public/gps-flota.apk
          echo "{\"versionCode\": $VERSION_CODE, \"versionName\": \"$VERSION_NAME\"}" > public/app-version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/gps-flota.apk public/app-version.json
          git commit -m "APK Android $VERSION_NAME"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
