<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPS Flota · Conductor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&display=swap">
  <meta name="theme-color" content="#23272b">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <header><a class="marca" href="/"><img src="icono.svg" alt="" width="30" height="30"><h1>GPS Flota<small>Conductor</small></h1></a>
    <button class="sec oculto" id="btnSalir">Salir</button></header>
  <main>
    <!-- 1. Entrar -->
    <section id="vLogin" class="tarjeta">
      <h2>Entrar</h2>
      <label>Código de conductor</label><input id="codigo" placeholder="C123456" autocomplete="username">
      <label>PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
      <p class="error" id="errLogin"></p>
      <button class="grande" id="btnEntrar">Entrar</button>
    </section>

    <!-- 2. Aviso de geolocalización (art. 90 LOPDGDD) -->
    <section id="vAviso" class="tarjeta oculto">
      <h2>Aviso sobre la geolocalización</h2>
      <div class="aviso" id="textoAviso"></div>
      <button class="grande" id="btnAceptar">He leído y entiendo el aviso</button>
    </section>

    <!-- 3. Jornada -->
    <section id="vJornada" class="oculto">
      <div class="tarjeta">
        <h2>Hola, <span id="nombre"></span></h2>
        <p class="nota" id="empresa" style="margin-top:-8px"></p>
        <p><span id="estado" class="estado off">Sin jornada: ubicación desactivada</span></p>
        <div id="bloqueInicio">
          <p id="miCamion"></p>
          <button class="grande" id="btnIniciar">Iniciar jornada</button>
        </div>
        <div id="bloqueFin" class="oculto">
          <p class="nota" id="infoGps">Esperando señal GPS…</p>
          <button class="grande peligro" id="btnFinalizar">Finalizar jornada</button>
        </div>
        <p class="error" id="errJornada"></p>
        <p class="nota">Tu ubicación solo se registra mientras la jornada está iniciada. Mantén esta pantalla abierta.</p>
      </div>
      <div id="mapa" class="mapa"></div>
      <div class="tarjeta" style="margin-top:16px">
        <h2>Mis jornadas registradas</h2>
        <table><thead><tr><th>Inicio</th><th>Fin</th><th>Camión</th><th>Puntos</th></tr></thead>
          <tbody id="misJornadas"></tbody></table>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="comun.js"></script>
  <script>
    const S = sesion('conductor');
    const $ = id => document.getElementById(id);
    let watchId = null, cola = [], mapa, marca, linea, matActual = '';

    function ver(v) { ['vLogin', 'vAviso', 'vJornada'].forEach(x => $(x).classList.toggle('oculto', x !== v)); $('btnSalir').classList.toggle('oculto', v === 'vLogin'); }

    $('btnEntrar').onclick = async () => {
      try {
        const r = await api('/api/conductor/login', { codigo: $('codigo').value, pin: $('pin').value });
        S.guardar({ token: r.token, nombre: r.nombre, empresa: r.empresa });
        $('errLogin').textContent = '';
        arrancar();
      } catch (e) { $('errLogin').textContent = e.message; }
    };
    $('btnSalir').onclick = () => { pararGps(); S.borrar(); if (marca) { marca.remove(); marca = null; } ver('vLogin'); };

    $('btnAceptar').onclick = async () => { await api('/api/conductor/aceptar-aviso', {}, S.token()); arrancar(); };

    async function arrancar() {
      if (!S.token()) return ver('vLogin');
      let est;
      try { est = await api('/api/conductor/estado', null, S.token()); }
      catch (e) { if (e.status === 401) return sesionCerrada(); S.borrar(); return ver('vLogin'); }
      if (!est.aviso_aceptado) {
        $('textoAviso').innerHTML = await (await fetch('aviso-conductor.html')).text();
        return ver('vAviso');
      }
      ver('vJornada');
      $('nombre').textContent = S.datos().nombre; $('empresa').textContent = S.datos().empresa;
      const cams = est.camiones || [];
      if (cams.length === 1) {
        $('miCamion').innerHTML = `Tu camión: ${placa(cams[0].matricula)} <span class="nota">${esc(cams[0].descripcion)}</span>`
          + (cams[0].en_ruta ? '<span class="nota">Ahora está en ruta con otro conductor.</span>' : '');
      } else if (cams.length > 1) {
        $('miCamion').innerHTML = `<label for="camion" style="width:100%;margin:0">¿Con qué camión sales hoy?</label>
          <select id="camion">${cams.map(k => `<option value="${k.id}"${k.en_ruta ? ' disabled' : ''}>${esc(k.matricula)} ${esc(k.descripcion)}${k.en_ruta ? ' (en ruta con otro conductor)' : ''}</option>`).join('')}</select>`;
      } else {
        $('miCamion').innerHTML = '<span class="nota">Tu empresa todavía no te ha asignado un camión. Cuando lo haga, podrás iniciar la jornada.</span>';
      }
      $('btnIniciar').disabled = !cams.some(k => !k.en_ruta);
      if (!mapa) {
        mapa = crearMapa('mapa');
        linea = L.polyline([], { color: '#0a4d9c', weight: 6, opacity: .85 }).addTo(mapa);
      }
      pintarEstado(est.jornada);
      if (est.jornada) iniciarGps();
      cargarMisJornadas();
    }

    function pintarEstado(j) {
      $('bloqueInicio').classList.toggle('oculto', !!j);
      $('bloqueFin').classList.toggle('oculto', !j);
      matActual = j ? j.matricula : '';
      $('estado').className = 'estado ' + (j ? 'on' : 'off');
      $('estado').textContent = j ? `En ruta con ${j.matricula}: registrando ubicación` : 'Sin jornada: ubicación desactivada';
    }

    $('btnIniciar').onclick = async () => {
      $('errJornada').textContent = '';
      try {
        await api('/api/conductor/jornada/iniciar', $('camion') ? { camion_id: Number($('camion').value) } : {}, S.token());
        linea.setLatLngs([]);
        arrancar();
      } catch (e) { $('errJornada').textContent = e.message; }
    };
    $('btnFinalizar').onclick = async () => {
      if (!confirm('¿Finalizar la jornada? Se dejará de registrar tu ubicación.')) return;
      await enviarCola();
      pararGps();
      await api('/api/conductor/jornada/finalizar', {}, S.token());
      arrancar();
    };

    function iniciarGps() {
      if (watchId !== null) return;
      if (!navigator.geolocation) { $('infoGps').textContent = 'Este dispositivo no tiene GPS disponible.'; return; }
      watchId = navigator.geolocation.watchPosition(p => {
        const punto = { lat: p.coords.latitude, lng: p.coords.longitude, precision: p.coords.accuracy,
          velocidad: p.coords.speed != null ? Math.round(p.coords.speed * 3.6) : null, ts: new Date(p.timestamp).toISOString() };
        cola.push(punto);
        const ll = [punto.lat, punto.lng];
        linea.addLatLng(ll);
        if (!marca) marca = L.marker(ll, { icon: iconoCamion(matActual) }).addTo(mapa); else marca.setLatLng(ll);
        mapa.setView(ll, Math.max(mapa.getZoom(), 15));
        $('infoGps').textContent = `Precisión de ${Math.round(punto.precision)} m` + (punto.velocidad != null ? `, ${punto.velocidad} km/h` : '') + (cola.length > 1 ? `. ${cola.length} puntos esperando cobertura.` : '.');
      }, err => { $('infoGps').textContent = ({ 1: 'No hay permiso de ubicación. Actívalo para esta web en los ajustes del navegador.', 2: 'No hay señal GPS. Comprueba que la ubicación del móvil está encendida.', 3: 'El GPS está tardando en responder. Seguimos intentándolo.' })[err.code] || 'Error de GPS.'; },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
    }
    // La empresa ha cambiado el PIN o ha cerrado la sesión: volver a la pantalla de entrada
    function sesionCerrada() {
      pararGps(); S.borrar();
      if (marca) { marca.remove(); marca = null; }
      $('pin').value = '';
      ver('vLogin');
      $('errLogin').textContent = 'Tu sesión se ha cerrado, por ejemplo porque te han cambiado el PIN. Vuelve a entrar con el PIN nuevo.';
    }
    function pararGps() { if (watchId !== null) navigator.geolocation.clearWatch(watchId); watchId = null; }

    // Envía cada 15 s; si no hay cobertura, los puntos esperan en la cola
    async function enviarCola() {
      if (!cola.length || !S.token()) return;
      const lote = cola.splice(0, 500);
      try { await api('/api/conductor/posiciones', lote, S.token()); }
      catch (e) {
        cola = lote.concat(cola);  // se guardan para enviarlos cuando vuelva a entrar o haya cobertura
        if (e.status === 401) sesionCerrada();
      }
    }
    setInterval(enviarCola, 15000);

    async function cargarMisJornadas() {
      const js = await api('/api/conductor/mis-jornadas', null, S.token());
      $('misJornadas').innerHTML = js.map(j => `<tr><td>${fecha(j.inicio)}</td><td>${j.fin ? fecha(j.fin) : 'En curso'}</td><td>${placa(j.matricula)}</td><td>${j.puntos}</td></tr>`).join('')
        || '<tr><td colspan="4" class="nota">Aún no hay jornadas</td></tr>';
    }

    arrancar();
  </script>
</body>
</html>
