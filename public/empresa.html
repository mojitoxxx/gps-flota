<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPS Flota · Empresa</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <header><h1>GPS <span>Flota</span> · <span id="nombreEmpresa" style="color:inherit">Empresa</span></h1>
    <button class="sec oculto" id="btnSalir">Salir</button></header>
  <main>
    <!-- Acceso -->
    <section id="vAcceso" class="inicio">
      <div class="tarjeta">
        <h2>Entrar</h2>
        <label>Email</label><input id="lEmail" type="email" autocomplete="username">
        <label>Contraseña</label><input id="lPass" type="password" autocomplete="current-password">
        <p class="error" id="errL"></p><button id="btnLogin">Entrar</button>
      </div>
      <div class="tarjeta">
        <h2>Registrar empresa</h2>
        <label>Nombre de la empresa</label><input id="rNombre">
        <label>Email</label><input id="rEmail" type="email">
        <label>Contraseña (mín. 8)</label><input id="rPass" type="password" autocomplete="new-password">
        <p class="error" id="errR"></p><button id="btnRegistro">Crear cuenta</button>
      </div>
    </section>

    <!-- Panel -->
    <section id="vPanel" class="oculto">
      <div class="pestanas">
        <button data-p="pDirecto" class="activa">En directo</button>
        <button data-p="pHistorial">Historial de rutas</button>
        <button data-p="pFlota">Camiones y conductores</button>
      </div>

      <div id="pDirecto">
        <div class="tarjeta"><p class="nota" id="resumenDirecto">Cargando…</p></div>
        <div id="mapaDirecto" class="mapa"></div>
      </div>

      <div id="pHistorial" class="oculto">
        <div class="tarjeta fila">
          <div><label>Día</label><input type="date" id="hFecha"></div>
          <div><label>Camión</label><select id="hCamion"></select></div>
          <div style="flex:0 0 auto"><button id="btnVerRuta">Ver rutas</button></div>
        </div>
        <div id="mapaHistorial" class="mapa"></div>
        <div class="tarjeta" style="margin-top:16px">
          <table><thead><tr><th>Camión</th><th>Conductor</th><th>Inicio</th><th>Fin</th><th>Km aprox.</th></tr></thead>
            <tbody id="tablaHistorial"></tbody></table>
        </div>
      </div>

      <div id="pFlota" class="oculto">
        <div class="tarjeta">
          <h2>Camiones</h2>
          <div class="fila">
            <div><label>Matrícula</label><input id="nMatricula" placeholder="1234ABC"></div>
            <div><label>Descripción</label><input id="nDesc" placeholder="Volvo FH tráiler"></div>
            <div style="flex:0 0 auto"><button id="btnCamion">Añadir</button></div>
          </div>
          <table style="margin-top:12px"><tbody id="listaCamiones"></tbody></table>
        </div>
        <div class="tarjeta">
          <h2>Conductores</h2>
          <p class="nota">Al crear un conductor se genera un código y un PIN. Entrégaselos junto con la información sobre la geolocalización: el PIN no se vuelve a mostrar.</p>
          <div class="fila">
            <div><label>Nombre</label><input id="nConductor"></div>
            <div style="flex:0 0 auto"><button id="btnConductor">Añadir</button></div>
          </div>
          <p id="nuevoPin" class="oculto tarjeta" style="margin-top:12px"></p>
          <table style="margin-top:12px"><thead><tr><th>Nombre</th><th>Código</th><th>Aviso leído</th></tr></thead>
            <tbody id="listaConductores"></tbody></table>
        </div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="comun.js"></script>
  <script>
    const S = sesion('empresa');
    const $ = id => document.getElementById(id);
    const tk = () => S.token();
    let mapaD, capaD, mapaH, capaH, camiones = [];

    async function entrar(url, cuerpo, err) {
      try { const r = await api(url, cuerpo); S.guardar({ token: r.token, nombre: r.nombre }); arrancar(); }
      catch (e) { $(err).textContent = e.message; }
    }
    $('btnLogin').onclick = () => entrar('/api/empresa/login', { email: $('lEmail').value, password: $('lPass').value }, 'errL');
    $('btnRegistro').onclick = () => entrar('/api/empresa/registro', { nombre: $('rNombre').value, email: $('rEmail').value, password: $('rPass').value }, 'errR');
    $('btnSalir').onclick = () => { S.borrar(); location.reload(); };

    document.querySelectorAll('.pestanas button').forEach(b => b.onclick = () => {
      document.querySelectorAll('.pestanas button').forEach(x => x.classList.toggle('activa', x === b));
      ['pDirecto', 'pHistorial', 'pFlota'].forEach(p => $(p).classList.toggle('oculto', p !== b.dataset.p));
      if (b.dataset.p === 'pDirecto') { mapaD.invalidateSize(); cargarDirecto(); }
      if (b.dataset.p === 'pHistorial') { if (!mapaH) { mapaH = crearMapa('mapaHistorial'); capaH = L.layerGroup().addTo(mapaH); } mapaH.invalidateSize(); }
      if (b.dataset.p === 'pFlota') cargarFlota();
    });

    async function arrancar() {
      if (!tk()) return;
      try { camiones = await api('/api/empresa/camiones', null, tk()); }
      catch { S.borrar(); return; }
      $('vAcceso').classList.add('oculto'); $('vPanel').classList.remove('oculto'); $('btnSalir').classList.remove('oculto');
      $('nombreEmpresa').textContent = S.datos().nombre;
      $('hFecha').value = new Date().toISOString().slice(0, 10);
      rellenarCamiones();
      mapaD = crearMapa('mapaDirecto'); capaD = L.layerGroup().addTo(mapaD);
      cargarDirecto(); setInterval(cargarDirecto, 15000);
    }

    function rellenarCamiones() {
      $('hCamion').innerHTML = '<option value="">Todos</option>' + camiones.map(c => `<option value="${c.id}">${esc(c.matricula)}</option>`).join('');
    }

    let primeraVez = true;
    async function cargarDirecto() {
      const lista = await api('/api/empresa/en-directo', null, tk());
      capaD.clearLayers();
      const puntos = [];
      lista.forEach(c => {
        if (c.lat == null) return;
        puntos.push([c.lat, c.lng]);
        L.marker([c.lat, c.lng]).addTo(capaD).bindPopup(
          `<b>${esc(c.matricula)}</b><br>${esc(c.conductor)}<br>${c.velocidad != null ? c.velocidad + ' km/h<br>' : ''}Última señal: ${fecha(c.ts)}`);
      });
      $('resumenDirecto').textContent = lista.length
        ? `${lista.length} camión(es) en jornada · se actualiza cada 15 s` : 'Ningún camión tiene la jornada iniciada ahora mismo.';
      if (puntos.length && primeraVez) { mapaD.fitBounds(puntos, { maxZoom: 13, padding: [40, 40] }); primeraVez = false; }
    }

    // Distancia aproximada (fórmula de Haversine)
    function km(pts) {
      let d = 0;
      for (let i = 1; i < pts.length; i++) {
        const [a, b] = [pts[i - 1], pts[i]], R = 6371, r = Math.PI / 180;
        const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
        d += 2 * R * Math.asin(Math.sqrt(h));
      }
      return d.toFixed(1);
    }

    const colores = ['#e8710a', '#1f77b4', '#2ca02c', '#9467bd', '#d62728', '#17becf'];
    $('btnVerRuta').onclick = async () => {
      const q = new URLSearchParams({ fecha: $('hFecha').value });
      if ($('hCamion').value) q.set('camion_id', $('hCamion').value);
      const js = await api('/api/empresa/historial?' + q, null, tk());
      capaH.clearLayers();
      const todos = [];
      js.forEach((j, i) => {
        const ll = j.puntos.map(p => [p.lat, p.lng]);
        if (!ll.length) return;
        todos.push(...ll);
        L.polyline(ll, { color: colores[i % colores.length], weight: 5 }).addTo(capaH).bindPopup(`${esc(j.matricula)} · ${esc(j.conductor)}`);
        L.circleMarker(ll[0], { radius: 7, color: '#1f8a4c', fillOpacity: 1 }).addTo(capaH).bindPopup('Inicio ' + fecha(j.puntos[0].ts));
        L.circleMarker(ll[ll.length - 1], { radius: 7, color: '#c0392b', fillOpacity: 1 }).addTo(capaH).bindPopup('Último punto ' + fecha(j.puntos.at(-1).ts));
      });
      if (todos.length) mapaH.fitBounds(todos, { padding: [30, 30] });
      $('tablaHistorial').innerHTML = js.map(j => `<tr><td>${esc(j.matricula)}</td><td>${esc(j.conductor)}</td><td>${fecha(j.inicio)}</td><td>${j.fin ? fecha(j.fin) : 'En curso'}</td><td>${km(j.puntos)}</td></tr>`).join('')
        || '<tr><td colspan="5" class="nota">No hay rutas ese día</td></tr>';
    };

    async function cargarFlota() {
      camiones = await api('/api/empresa/camiones', null, tk());
      rellenarCamiones();
      $('listaCamiones').innerHTML = camiones.map(c => `<tr><td><b>${esc(c.matricula)}</b></td><td>${esc(c.descripcion)}</td></tr>`).join('') || '<tr><td class="nota">Sin camiones</td></tr>';
      const cs = await api('/api/empresa/conductores', null, tk());
      $('listaConductores').innerHTML = cs.map(c => `<tr><td>${esc(c.nombre)}</td><td><code>${c.codigo}</code></td><td>${c.aviso_aceptado ? fecha(c.aviso_aceptado) : 'Pendiente'}</td></tr>`).join('');
    }
    $('btnCamion').onclick = async () => {
      try { await api('/api/empresa/camiones', { matricula: $('nMatricula').value, descripcion: $('nDesc').value }, tk()); $('nMatricula').value = $('nDesc').value = ''; cargarFlota(); }
      catch (e) { alert(e.message); }
    };
    $('btnConductor').onclick = async () => {
      try {
        const r = await api('/api/empresa/conductores', { nombre: $('nConductor').value }, tk());
        $('nuevoPin').innerHTML = `Conductor creado. Código: <code>${r.codigo}</code> · PIN: <code>${r.pin}</code><br><span class="nota">Apúntalo ahora; el PIN no se volverá a mostrar.</span>`;
        $('nuevoPin').classList.remove('oculto'); $('nConductor').value = ''; cargarFlota();
      } catch (e) { alert(e.message); }
    };

    arrancar();
  </script>
</body>
</html>
